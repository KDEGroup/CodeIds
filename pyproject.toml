[project]
authors = [{ name = "ddd", email = "ddd@example.com" }]
dependencies = [
    "vllm==0.11.2",
    "pydantic-settings>=2.12.0,<3",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25.0,<0.26",
    "jedi>=0.19.2,<0.20",
    "contexttimer>=0.3.3,<0.4",
    "rank-bm25>=0.2.2,<0.3", "loguru>=0.7.3,<0.8", "scikit-learn>=1.7.2,<2", "accelerate>=1.12.0,<2", "editdistance>=0.8.1,<0.9", "nltk>=3.9.2,<4", "pyright>=1.1.407,<2",
]
name = "codeusage"
requires-python = "==3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
codeusage = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
cuda-version = ">=12"
